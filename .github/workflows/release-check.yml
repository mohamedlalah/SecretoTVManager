name: Secreto TV Manager release check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A PR that only changes README.md or Markdown under docs/ ships no new build, so it needs no
      # version advance. The job still runs and passes; every other PR, and manual runs, keep the full gate.
      - name: Classify changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames "$BASE...$HEAD" | python3 scripts/release/docs_only.py >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check fork version and fork changelog
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/release/check_release.py
      - name: Documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Only README.md or docs/*.md changed; no release version advance is required."
      - name: Regression tests for release preparation
        run: python3 -m unittest discover -s tests/release -v
