name: Secreto TV Manager release check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check fork version and fork changelog
        run: python3 scripts/release/check_release.py
      - name: Regression tests for release preparation
        run: python3 -m unittest discover -s tests/release -v
