name: Prepare Secreto TV Manager release (unsigned)

# Explicit manual preparation only. No push/tag triggers, signing or publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate fork release
        run: python3 scripts/release/check_release.py
      - name: Build unsigned APK
        run: ./gradlew :app:assembleRelease -Dorg.gradle.java.installations.auto-download=false --console=plain
      - name: Prepare corresponding source and accompanying materials
        run: python3 scripts/release/prepare_materials.py --fetch-dependency-sources
      - uses: actions/upload-artifact@v7
        with:
          name: Secreto-TV-Manager-1.0.0-unsigned-review-only
          path: app/build/release-materials/
          if-no-files-found: error
          retention-days: 14
