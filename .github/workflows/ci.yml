name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # JDK 25: Kadb ships Java 25 bytecode, so :adb tests need a 25 runtime.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Preserve the project's Java 21 daemon; Kadb tests require Java 25 workers.
      - name: Prepare isolated Java 25 test launcher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/secreto-jdk25-tests.gradle" <<'GRADLE'
          import org.gradle.api.tasks.testing.Test
          import org.gradle.jvm.toolchain.JavaLanguageVersion
          import org.gradle.jvm.toolchain.JavaToolchainService

          allprojects {
              tasks.withType(Test).configureEach {
                  def tools = project.extensions.getByType(JavaToolchainService)
                  javaLauncher.set(tools.launcherFor {
                      languageVersion.set(JavaLanguageVersion.of(25))
                  })
                  doFirst {
                      logger.lifecycle("Verification test JVM: Java " + javaLauncher.get().metadata.languageVersion + " / " + javaLauncher.get().metadata.jvmVersion)
                  }
              }
          }
          GRADLE

      # build = assemble (debug + release) + unit tests + Android lint.
      # This CI build never replaces the separately verified official signed APK.
      - name: Build, test and lint with compatible test JVMs
        run: >-
          ./gradlew build
          --init-script "$RUNNER_TEMP/secreto-jdk25-tests.gradle"
          -Dorg.gradle.java.installations.auto-download=false
          --no-configuration-cache --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
